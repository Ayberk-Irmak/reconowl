[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strix-scanner"
description = "Recon-to-report offensive security orchestrator for authorized penetration testing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ayberk Irmak" }]
keywords = ["security", "pentest", "recon", "scanner", "vulnerability", "cvss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
    "requests>=2.28",
    "dnspython>=2.3",
    "jinja2>=3.1",
    "cryptography>=40.0",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Headless JS rendering for SPAs. Optional: Strix falls back to static crawling
# when absent. After install, run `playwright install chromium` for the browser.
render = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/Ayberk-Irmak/strix"
Repository = "https://github.com/Ayberk-Irmak/strix"
Issues = "https://github.com/Ayberk-Irmak/strix/issues"

[project.scripts]
strix = "strix.cli:main"

[tool.setuptools.dynamic]
version = { attr = "strix.__version__" }

[tool.setuptools.packages.find]
include = ["strix*"]

[tool.setuptools.package-data]
strix = ["data/wordlists/*.txt", "data/*.json", "report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
